name: Build and centrally sign TestPak2

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: testpak2-main
  cancel-in-progress: true

jobs:
  build-sign-release:
    name: Build, sign and publish Mini Zipla
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APK_SIGNING_SERVICE_URL: https://signer.dinceryuksek.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION_CODE="$GITHUB_RUN_NUMBER"
          APP_VERSION_NAME="1.0.$GITHUB_RUN_NUMBER"
          gradle --no-daemon \
            -PappVersionCode="$APP_VERSION_CODE" \
            -PappVersionName="$APP_VERSION_NAME" \
            assembleRelease
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          echo "UNSIGNED_APK=$APK" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$APP_VERSION_CODE" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$APP_VERSION_NAME" >> "$GITHUB_ENV"

      - name: Check central signer
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "\${APK_SIGNING_SERVICE_URL%/}/health" -o "$RUNNER_TEMP/health.json"
          grep -q '"ok":true' "$RUNNER_TEMP/health.json"
          grep -q '"oidc":true' "$RUNNER_TEMP/health.json"

      - name: Obtain GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=socialworst-apk-signer")"
          TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$RESPONSE")"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Bootstrap isolated signing key for this repo
        env:
          SIGNING_OIDC_TOKEN: \${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST "\${APK_SIGNING_SERVICE_URL%/}/v1/bootstrap" \
            -H "Authorization: Bearer $SIGNING_OIDC_TOKEN" \
            -F "key_id=testpak2" \
            -F "package_name=com.dincer552.testpak2" \
            -o "$RUNNER_TEMP/bootstrap.json"
          cat "$RUNNER_TEMP/bootstrap.json"

      - name: Sign APK on central VM
        env:
          SIGNING_OIDC_TOKEN: \${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST "\${APK_SIGNING_SERVICE_URL%/}/v1/sign" \
            -H "Authorization: Bearer $SIGNING_OIDC_TOKEN" \
            -F "key_id=testpak2" \
            -F "apk=@$UNSIGNED_APK;type=application/vnd.android.package-archive" \
            -o "$RUNNER_TEMP/testpak2-signed.apk"
          test -s "$RUNNER_TEMP/testpak2-signed.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$RUNNER_TEMP/testpak2-signed.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$RUNNER_TEMP/testpak2-signed.apk" | grep -F "package: name='com.dincer552.testpak2' versionCode='$APP_VERSION_CODE'"
          mkdir -p release
          cp "$RUNNER_TEMP/testpak2-signed.apk" release/testpak2.apk
          sha256sum release/testpak2.apk

      - name: Publish signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v\${{ env.APP_VERSION_NAME }}
          name: Mini Zipla \${{ env.APP_VERSION_NAME }}
          target_commitish: main
          make_latest: true
          generate_release_notes: true
          files: release/testpak2.apk
          fail_on_unmatched_files: true

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: testpak2-signed-\${{ env.APP_VERSION_NAME }}
          path: release/testpak2.apk
          if-no-files-found: error
          retention-days: 30
