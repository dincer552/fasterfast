name: Build, sign and publish FasterFastMini

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: fasterfastmini-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sign-release:
    name: Build, verify, sign and publish FasterFastMini
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APK_SIGNING_SERVICE_URL: https://signer.dinceryuksek.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION_CODE="$GITHUB_RUN_NUMBER"
          APP_VERSION_NAME="1.0.$GITHUB_RUN_NUMBER"
          gradle --no-daemon \
            -PappVersionCode="$APP_VERSION_CODE" \
            -PappVersionName="$APP_VERSION_NAME" \
            assembleRelease
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.dincer552.testpak2' versionCode='$APP_VERSION_CODE'"
          echo "UNSIGNED_APK=$APK" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$APP_VERSION_CODE" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$APP_VERSION_NAME" >> "$GITHUB_ENV"

      - name: Validate central signer
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 \
            "${APK_SIGNING_SERVICE_URL%/}/health" -o "$RUNNER_TEMP/signer-health.json"
          grep -q '"ok":true' "$RUNNER_TEMP/signer-health.json"
          grep -q '"oidc":true' "$RUNNER_TEMP/signer-health.json"

      - name: Obtain short-lived GitHub OIDC token
        id: oidc
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=socialworst-apk-signer")"
          TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$RESPONSE")"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Create this repository's isolated signing key if needed
        if: steps.oidc.outcome == 'success'
        env:
          SIGNING_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST "${APK_SIGNING_SERVICE_URL%/}/v1/bootstrap" \
            -H "Authorization: Bearer $SIGNING_OIDC_TOKEN" \
            -F "key_id=testpak2" \
            -F "package_name=com.dincer552.testpak2" \
            -o "$RUNNER_TEMP/bootstrap-response.json"
          grep -q '"ok":true' "$RUNNER_TEMP/bootstrap-response.json"

      - name: Sign APK with the central VM signer
        if: steps.oidc.outcome == 'success'
        env:
          SIGNING_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST "${APK_SIGNING_SERVICE_URL%/}/v1/sign" \
            -H "Authorization: Bearer $SIGNING_OIDC_TOKEN" \
            -F "key_id=testpak2" \
            -F "apk=@$UNSIGNED_APK;type=application/vnd.android.package-archive" \
            -o "$RUNNER_TEMP/testpak2-signed.apk"
          test -s "$RUNNER_TEMP/testpak2-signed.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$RUNNER_TEMP/testpak2-signed.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -p 4 "$RUNNER_TEMP/testpak2-signed.apk"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$RUNNER_TEMP/testpak2-signed.apk")"
          echo "$BADGING" | grep -F "package: name='com.dincer552.testpak2' versionCode='$APP_VERSION_CODE'"
          mkdir -p release
          cp "$RUNNER_TEMP/testpak2-signed.apk" release/testpak2.apk
          sha256sum release/testpak2.apk > release/testpak2.apk.sha256
          cat release/testpak2.apk.sha256

      - name: Publish signed FasterFastMini APK
        if: steps.oidc.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}
          name: FasterFastMini ${{ env.APP_VERSION_NAME }}
          target_commitish: main
          make_latest: true
          generate_release_notes: true
          files: |
            release/testpak2.apk
            release/testpak2.apk.sha256
          fail_on_unmatched_files: true

      - name: Upload signed APK artifact
        if: steps.oidc.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: fasterfastmini-signed-${{ env.APP_VERSION_NAME }}
          path: |
            release/testpak2.apk
            release/testpak2.apk.sha256
          if-no-files-found: error
          retention-days: 90
